services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jevtrieval
      POSTGRES_USER: jevtrieval
      POSTGRES_PASSWORD: jevtrieval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jevtrieval -d jevtrieval"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
